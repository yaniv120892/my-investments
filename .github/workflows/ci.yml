name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded push has nothing left to prove; let the newer run win.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      # postinstall runs `prisma generate`, which reads the schema file and
      # needs no database, so the whole gate runs without secrets.
      - run: npm ci

      - run: npm run lint

      - run: npm run prettier

      # `npm test` is test:unit — contract tests need the live network and the
      # evals cost money, so both stay out of the gate.
      - run: npm test

      - run: npm run build
